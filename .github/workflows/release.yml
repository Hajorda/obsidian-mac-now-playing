name: Release Obsidian plugin

on:
  push:
    tags:
      - "*" # Trigger the action on any tag push (e.g., 1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x' # Use Node 18 or whichever version you prefer

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "New release for Mac Now Playing plugin." \
            main.js manifest.json styles.css
